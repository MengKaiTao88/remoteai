gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.rootDir, '../../../.codex-tmp/lounge-scroll/native-build'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.loungescrolltest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/LoungeFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'lounge-scroll-fixture.apk' }
        }
    }
}
