gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.rootDir, '../../../.codex-tmp/port-mapping-build'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.portmappingtest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/PortMappingFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'port-mapping-fixture.apk' }
        }
    }
}
