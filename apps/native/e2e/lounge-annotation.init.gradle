gradle.afterProject { project ->
    if (project.path == ':app') {
        // Isolate the fixture from other native checks and the installed production application.
        project.layout.buildDirectory.set(new File(project.rootDir, '../../../.codex-tmp/lounge-annotation-build'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.loungeannotationtest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/LoungeAnnotationFixture.tsx')
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'lounge-annotation-fixture.apk' }
        }
    }
}
