gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.rootDir, '../../../.codex-tmp/lounge-files/native-build'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.loungefilestest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/LoungeAttachmentsFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'lounge-files-fixture.apk' }
        }
    }
}
