// Separate package and build output preserve the installed application and concurrent test builds.
gradle.afterProject { project ->
    if (project.path == ':app') {
        project.layout.buildDirectory.set(new File(project.rootDir, '../../../.codex-tmp/chat-text-flicker-build'))
        project.android.defaultConfig.applicationId = 'com.codexswitch.mobile.textflickertest'
        project.extensions.getByName('react').entryFile = new File(project.rootDir, '../e2e/ChatTextFlickerFixture.tsx')
        project.extensions.getByName('react').debuggableVariants = []
        project.android.applicationVariants.all { variant ->
            variant.outputs.all { outputFileName = 'chat-text-flicker-fixture.apk' }
        }
    }
}
