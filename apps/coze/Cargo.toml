[package]
name = "remoteai-coze"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"

[[bin]]
name = "remoteai-coze"
path = "src/main.rs"

[[bin]]
name = "remoteai-coze-python"
path = "src/bin/python.rs"

[dependencies]
base64 = "0.22"
calamine = "0.26"
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
hayro = "0.7.1"
monty = "=1.0.0"
monty-alloc = { version = "=1.0.0", features = ["exit-code"] }
monty-types = "=1.0.0"
oxc = { version = "=0.75.0", features = ["transformer", "semantic", "codegen"] }
# Oxc 0.75 uses u32 version fields; browserslist 2.3 changed them incompatibly to u16.
oxc-browserslist = "=2.0.0"
pdf-extract = "0.10"
png = "0.18"
quick-xml = "0.37"
rquickjs = { version = "0.9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled", "hooks", "limits", "backup"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 0

[profile.test]
debug = 0
